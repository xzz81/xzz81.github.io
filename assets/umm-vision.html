<script>
'use strict';
const topics=JSON.parse(document.getElementById('topics').textContent);
const vision=document.querySelector('.vision');
const main=document.querySelector('.scene-main');
const edges=[...main.querySelectorAll('#capability-connections .arrow')];
const capabilities=[...main.querySelectorAll('[data-capability]')];
const tooltip=document.getElementById('details');
const title=document.getElementById('details-title');
const body=document.getElementById('details-body');
const narrow=matchMedia('(max-width:700px)');
const coarse=matchMedia('(hover:none)');
const reduced=matchMedia('(prefers-reduced-motion:reduce)');
const motionButton=document.getElementById('motion-toggle');
let userPaused=false,inViewport=true;
function updateMotion(){const requested=userPaused||reduced.matches;document.body.dataset.motionPaused=String(requested||document.hidden||!inViewport);motionButton.disabled=reduced.matches;motionButton.setAttribute('aria-pressed',String(requested));const label=reduced.matches?'Reduced motion enabled':requested?'Resume motion':'Pause motion';motionButton.setAttribute('aria-label',label);motionButton.title=label;}
motionButton.addEventListener('click',()=>{userPaused=!userPaused;updateMotion();});reduced.addEventListener('change',updateMotion);updateMotion();
document.addEventListener('visibilitychange',updateMotion);
if('IntersectionObserver' in window){const visibility=new IntersectionObserver(([entry])=>{if(inViewport!==entry.isIntersecting){inViewport=entry.isIntersecting;updateMotion();}});visibility.observe(vision);}
let active=null,anchor=null,pinned=false,pointerKind='mouse',inputKind='pointer',hideTimer=null;
function responsive(){main.setAttribute('viewBox',narrow.matches?'0 0 1600 1120':'0 0 2200 1120');if(active)closeDetails();}
narrow.addEventListener('change',responsive);responsive();
function cancelHide(){clearTimeout(hideTimer);hideTimer=null;}
function place(event){if(narrow.matches)return;const box=tooltip.getBoundingClientRect();let x,y;if(event&&Number.isFinite(event.clientX)){x=event.clientX+20;y=event.clientY+20;if(x+box.width>innerWidth-16)x=event.clientX-box.width-20;if(y+box.height>innerHeight-16)y=event.clientY-box.height-20;}else{const ref=anchor.getBoundingClientRect();x=ref.left+ref.width/2-box.width/2;y=ref.bottom+12;if(y+box.height>innerHeight-16)y=ref.top-box.height-12;}tooltip.style.left=`${Math.max(16,Math.min(x,innerWidth-box.width-16))}px`;tooltip.style.top=`${Math.max(16,Math.min(y,innerHeight-box.height-16))}px`;}
function releaseAnchor(){if(!anchor)return;anchor.setAttribute('aria-expanded','false');anchor.removeAttribute('aria-describedby');}
function showDetails(element,event,pin=false){
  cancelHide();
  if(anchor!==element){releaseAnchor();anchor=element;anchor.setAttribute('aria-expanded','true');anchor.setAttribute('aria-describedby','details');}
  if(active!==element.dataset.topic){
    active=element.dataset.topic;
    const topic=topics[active],related=topic.related||[];
    title.textContent=topic.title;body.textContent=topic.body;tooltip.style.setProperty('--topic',topic.color);
    if(related.length)main.dataset.active=active;else delete main.dataset.active;
    for(const edge of edges){edge.classList.toggle('is-related',active.includes('-to-')?edge.id===active:related.includes(edge.dataset.from)||related.includes(edge.dataset.to));edge.classList.toggle('is-active',edge.id===active);}
    for(const node of capabilities)node.classList.toggle('is-related',related.includes(node.dataset.capability));
  }
  pinned=pin;tooltip.dataset.pinned=String(pin);tooltip.setAttribute('role',pin?'dialog':'tooltip');tooltip.hidden=false;place(event);
}
function closeDetails(){cancelHide();if(!active)return;releaseAnchor();active=null;anchor=null;pinned=false;tooltip.hidden=true;tooltip.dataset.pinned='false';tooltip.setAttribute('role','tooltip');delete main.dataset.active;for(const edge of edges)edge.classList.remove('is-related','is-active');for(const node of capabilities)node.classList.remove('is-related');}
function leave(event){if(pinned||tooltip.contains(event.relatedTarget))return;cancelHide();hideTimer=setTimeout(()=>{if(inputKind==='keyboard'&&document.activeElement?.matches('[data-hotspot]'))return;closeDetails();},110);}
document.addEventListener('pointerdown',e=>{inputKind='pointer';pointerKind=e.pointerType||'mouse';if(!e.target.closest('[data-hotspot],#details'))closeDetails();});
document.addEventListener('keydown',e=>{if(e.key==='Tab')inputKind='keyboard';if(e.key==='Escape')closeDetails();});
vision.addEventListener('pointerover',e=>{const target=e.target.closest('[data-hotspot]');if(!target||target.contains(e.relatedTarget)||e.pointerType==='touch'||coarse.matches||pinned)return;inputKind='pointer';showDetails(target,e);});
vision.addEventListener('pointerout',e=>{const target=e.target.closest('[data-hotspot]');if(target&&!target.contains(e.relatedTarget))leave(e);});
vision.addEventListener('focusin',e=>{const target=e.target.closest('[data-hotspot]');if(target&&inputKind==='keyboard')showDetails(target);});
vision.addEventListener('focusout',e=>{if(e.target.closest('[data-hotspot]')&&!pinned&&!tooltip.contains(e.relatedTarget))closeDetails();});
vision.addEventListener('click',e=>{const target=e.target.closest('[data-hotspot]');if(!target)return;if(coarse.matches||pointerKind==='touch'||pointerKind==='pen'){if(active===target.dataset.topic&&pinned)closeDetails();else showDetails(target,null,true);}else showDetails(target,e);});
vision.addEventListener('keydown',e=>{const target=e.target.closest('[data-hotspot]');if(target&&(e.key==='Enter'||e.key===' ')){e.preventDefault();inputKind='keyboard';showDetails(target);}});
tooltip.addEventListener('pointerenter',cancelHide);tooltip.addEventListener('pointerleave',e=>{if(!pinned&&!anchor?.contains(e.relatedTarget))leave(e);});document.getElementById('details-close').addEventListener('click',closeDetails);
window.addEventListener('resize',()=>{if(active&&!narrow.matches)place();});window.addEventListener('blur',()=>{if(!pinned)closeDetails();});
</script>
</body>
